spring:
  profiles:
    group:
      prod:
        - "google-auth"
        - "gmail"
        - "ai"
      test:
        - "google-auth"
        - "google-account-samples"
      benchmark-dev:
        - "google-auth"
        - "dev"
        - "google-account-samples"
        - "gmail"
        - "ai"
      benchmark:
        - "google-auth"
        - "dev"
        - "google-account-samples"
        - "gmail"
        - "ai"
---

spring:
  mvc:
    async:
      request-timeout: 60000
  application:
    name: subscription-killer-api
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      keepalive-time: 30000
      max-lifetime: 600000
      connection-test-query: SELECT 1
      initialization-fail-timeout: 1
  jpa:
    hibernate:
      ddl-auto: none
  session:
    jdbc:
      initialize-schema: always
    timeout: 3d
  ai:
    model:
      chat: none
  flyway:
    enabled: true
    baseline-on-migrate: true
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: none
        secure: true
        path: /

#management:
#  zipkin:
#    tracing:
#      export:
#        enabled: false
logging:
  charset:
    console: UTF-8
app:
  oauth2:
    redirect-uri: ${FRONTEND_URL}/report
  cors:
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    max-age: 3600
  mail:
    analysis-months: 13
    max-snippet-size: 100
    samples-dir: private/messages
    samples-fallback: static/messages/sample_messages_netflix_sketchfab.json
  min-request-interval-hours: 72
  prompts:
    filter-and-categorize-emails: classpath:/prompts/eventRuleUpdate/active/1-filter-and-categorize-emails-v4.st
    generalize-string-pattern: classpath:/prompts/eventRuleUpdate/active/2-generalize-string-pattern-v4.st
  guest-app-user:
    subject: GUEST_APP_USER_SUBJECT
    name: GUEST_APP_USER_NAME
    email: guest@example.com
---

spring:
  config:
    activate:
      on-profile: google-auth
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${APP_GOOGLE_CLIENT_ID}
            client-secret: ${APP_GOOGLE_CLIENT_SECRET}
            redirect-uri: ${FRONTEND_URL}/api/login/oauth2/code/google
            client-authentication-method: client_secret_basic
            scope:
              - openid
              - email
              - profile
              - https://www.googleapis.com/auth/gmail.readonly
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent%20select_account
app:
  google:
    client-id: ${APP_GOOGLE_CLIENT_ID}
    client-secret: ${APP_GOOGLE_CLIENT_SECRET}
    token-server-url: https://oauth2.googleapis.com/token
    token-refresh-threshold-seconds: 300
---

spring:
  config:
    activate:
      on-profile: dev
  reactor:
    context-propagation: auto
  jpa:
    hibernate:
      ddl-auto: update
    # Run this to generate V1__schema.sql
    #    properties:
    #      hibernate:
    #        hbm2ddl:
    #          auto: create
management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
      export:
        enabled: true
  info:
    git:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %-5line --- [%thread] %-40.40logger{39} : %msg%n"
  level:
    com.matchalab.subscription_killer_api: DEBUG
    org:
      springframework:
        security: DEBUG
        security.oauth2: DEBUG
        security.oauth2.client: DEBUG
        session: DEBUG
      hibernate:
        SQL: DEBUG
app:
  cors:
    allowed-origins:
      - ${FRONTEND_URL}
  min-request-interval-hours: 0
---


spring:
  config:
    activate:
      on-profile: local-ssl
server.port: 8443
server.ssl.key-store: classpath:certs/keystore.p12
server.ssl.key-store-password: password
server.ssl.key-store-type: PKCS12
server.ssl.key-alias: 1
---

spring:
  config:
    activate:
      on-profile: prod
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.matchalab.subscription_killer_api: INFO
    org.springframework: INFO
    org.springframework.security: INFO