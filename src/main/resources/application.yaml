spring:
  profiles:
    group:
      prod:
        - "oauth"
        - "gmail"
        - "ai"
      test:
        - "dev"
        - "oauth"
        - "dev-db-local"
      benchmark:
        - "oauth"
      benchmark-dev:
        - "benchmark"
        - "dev"
      schema-generation:
        - "dev"
        - "oauth"
        - "dev-db-local"
        - "dev-fe-local"
      local:
        - "dev"
        - "oauth"
        - "gmail"
        - "dev-db-local"
        - "dev-fe-local"
      db-remote-fe-local:
        - "dev"
        - "oauth"
        - "gmail"
        - "dev-db-remote"
        - "dev-fe-local"
      db-local-fe-remote:
        - "dev"
        - "oauth"
        - "gmail"
        - "dev-db-local"
        - "dev-fe-remote"
      db-remote-fe-remote:
        - "dev"
        - "oauth"
        - "gmail"
        - "dev-db-remote"
        - "dev-fe-remote"
---
spring:
  mvc:
    async:
      request-timeout: 60000
  application:
    name: subscription-killer-api
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

      connection-timeout: 15000
      validation-timeout: 5000

      max-lifetime: 300000     # 5 min
      idle-timeout: 60000      # 1 min
      keepalive-time: 30000

      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: none
    generate-ddl: false
    open-in-view: false
  session:
    jdbc:
      initialize-schema: always
    timeout: 3d
  ai:
    model:
      chat: none
  flyway:
    enabled: true
    baseline-on-migrate: true
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: none
        secure: true
        path: /

management:
  observations:
    annotations:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
#  zipkin:
#    tracing:
#      export:
#        enabled: false
logging:
  charset:
    console: UTF-8
app:
  oauth2:
    redirect-uri: ${FRONTEND_URL}
  cors:
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    max-age: 3600
    allowed-origins:
      - ${FRONTEND_URL}
  mail:
    analysis-months: 13
    max-snippet-size: 100
  min-request-interval-seconds: 600
  prompts:
    filter-and-categorize-emails: classpath:/prompts/eventRuleUpdate/active/1-filter-and-categorize-emails-v6.st
    generalize-string-pattern: classpath:/prompts/eventRuleUpdate/active/2-generalize-string-pattern-v6.st
  guest-app-user:
    name: GUEST
    emails:
      - GUEST_EMAIL_FIRST@example.com
      - GUEST_EMAIL_SECONDS@example.com
---

spring:
  config:
    activate:
      on-profile: prod
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.matchalab.subscription_killer_api: INFO
    org.springframework: INFO
    org.springframework.security: INFO