name: Benchmark Build

permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - 'v*-perf.*'
      - 'v*-perf.*\+test*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    outputs:
      event_type: ${{ steps.benchmark.outputs.event_type }}
      image_name: ${{ steps.benchmark.outputs.image_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Docker Metadata
        id: meta
        run: |
          # Lowercase the owner
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${OWNER}/sublog" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image_name }}:${{ github.sha }}
          build-args: |
            HF_BASE_URL=${{ vars.HF_BASE_URL }}
            HF_OWNER=${{ vars.HF_OWNER }}
            HF_REPO=${{ vars.HF_REPO }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_REF_NAME=${{ github.ref_name }}
            IMAGE_CREATED=${{ github.event.head_commit.timestamp }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image_name }}:${{ github.sha }}
          build-args: |
            HF_BASE_URL=${{ vars.HF_BASE_URL }}
            HF_OWNER=${{ vars.HF_OWNER }}
            HF_REPO=${{ vars.HF_REPO }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_REF_NAME=${{ github.ref_name }}
            IMAGE_CREATED=${{ github.event.head_commit.timestamp }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}

      - name: Prepare Benchmark Outputs
        id: benchmark
        run: |
          # Determine event type based on tag pattern
          if [[ "${{ github.ref_name }}" =~ ^v.*-perf.*\+test.*$ ]]; then
            EVENT_TYPE="new_ai_benchmark_build_test"
          else
            EVENT_TYPE="new_ai_benchmark_build"
          fi
          echo "event_type=${EVENT_TYPE}" >> $GITHUB_OUTPUT
          echo "image_name=${{ steps.meta.outputs.image_name }}:${{ github.sha }}" >> $GITHUB_OUTPUT


  trigger-benchmark:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Benchmark
        id: trigger
        run: |
          echo "Triggering benchmark with event type: ${{ needs.build-and-push.outputs.event_type }}"
          echo "Image to benchmark: ${{ needs.build-and-push.outputs.image_name }}"
          
          response=$(curl -s -w "%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ secrets.BENCHMARK_REPO }}/dispatches \
            -d '{"event_type": "'${{ needs.build-and-push.outputs.event_type }}'", "client_payload": {"image_name": "'${{ needs.build-and-push.outputs.image_name }}'"}}')
          
          http_code="${response: -3}"
          if [ "$http_code" -eq 204 ]; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "Benchmark triggered successfully"
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "Failed to trigger benchmark. HTTP code: $http_code"
            exit 1
          fi
